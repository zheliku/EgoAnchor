# EgoAnchor 本地开发 NATS 配置
server_name: egoanchor-dev

# 只允许本机连接，最安全，适合 Python 和 Unity 都在同一台 PC 上调试。
host: 127.0.0.1
port: 4222

# HTTP 监控端口。只监听本机，用于排查连接和统计。
http: 127.0.0.1:8222

# v2 本地图片/Quest 双目 JPEG payload 可能超过 NATS 默认 1MB。
# 这里放宽到 16MB，真实实时性仍由 Unity latest-only 发送泵丢旧帧保证。
max_payload: 16777216

# 本地开发日志可以稍微详细一点。
debug: false
trace: false
logtime: true
