meta:
  profile: academic-paper
  figureType: architecture
  theme: academic-color
  layout: horizontal
  canvas: 1800x1080
  title: EgoAnchor 中文系统架构图
  description: Quest 采集、Python 视觉计算、Unity 锚定运行时、frame_id 帧对齐、三平面通信与离线评估支撑。
  legend: |
    粗橙色箭头: frame_id 精确回查核心路径
    蓝色虚线: ZMQ 数据面
    绿色虚线: NATS 消息面
    琥珀点划线: NATS 命令面
    灰色点线: 协议生成与离线评估依赖

modules:
  - id: unity_capture
    label: Quest 3 / Unity 采集端
  - id: python_vision
    label: 外部视觉计算 / Python
  - id: unity_runtime
    label: Unity 锚定运行时
  - id: support
    label: 协议与离线评估支撑

nodes:
  - id: stereo_frame
    label: 双目透视帧
    type: document
    module: unity_capture
    bounds: { x: 105, y: 195, width: 195, height: 78 }
  - id: camera_info
    label: 相机信息
    type: document
    module: unity_capture
    bounds: { x: 335, y: 195, width: 190, height: 78 }
  - id: frame_pose_history
    label: "帧姿态历史\nframe_id → T^W_C(t_i)"
    type: database
    module: unity_capture
    bounds: { x: 155, y: 315, width: 330, height: 98 }
  - id: quest_stream_publisher
    label: "QuestStreamPublisher\nProtobuf / latest-only"
    type: service
    module: unity_capture
    bounds: { x: 185, y: 452, width: 285, height: 84 }
  - id: hmd_tracking_note
    label: "参考相机世界位姿\n来自头显自身跟踪\n纯视觉只修饰物体位姿估计链路"
    type: text
    module: unity_capture
    bounds: { x: 125, y: 585, width: 390, height: 105 }

  - id: quest_stream_receiver
    label: "最新帧接收\ndecode / dedup"
    type: service
    module: python_vision
    bounds: { x: 690, y: 195, width: 205, height: 78 }
  - id: quest_calibration
    label: "标定映射\ncamera_info → K"
    type: process
    module: python_vision
    bounds: { x: 930, y: 195, width: 180, height: 78 }
  - id: pose_pipeline
    label: "视觉位姿流水线\n分割 YOLOE/SAM3 · FFS 深度 · FoundationPose · Cutie"
    type: process
    module: python_vision
    bounds: { x: 690, y: 322, width: 420, height: 182 }
  - id: pose_score
    label: "渲染质量与可靠性评分\nR = Gate × Quality × Confidence\n加权几何核 + mask 调制 + warmup"
    type: process
    module: python_vision
    bounds: { x: 690, y: 540, width: 420, height: 112 }
  - id: tracking_runtime
    label: "TrackingRuntime\n持有 pipeline/GPU 状态，发布 PoseResult"
    type: service
    module: python_vision
    bounds: { x: 740, y: 690, width: 320, height: 64 }

  - id: pose_receiver
    label: "Pose 接收\nlatest drain"
    type: service
    module: unity_runtime
    bounds: { x: 1270, y: 195, width: 205, height: 78 }
  - id: anchor_runtime_hub
    label: "运行时 Hub\nfan-out / fan-in"
    type: service
    module: unity_runtime
    bounds: { x: 1510, y: 195, width: 175, height: 78 }
  - id: frame_aligner
    label: "帧对齐世界锚定\nT^W_O(t_i) = T^W_C(t_i) · T^C_O(t_i)"
    type: process
    module: unity_runtime
    bounds: { x: 1315, y: 318, width: 350, height: 112 }
  - id: anchor_policy_host
    label: "AnchorPolicyHost\n运动模型 × 平滑策略 · Score Gate · FSM"
    type: process
    module: unity_runtime
    bounds: { x: 1270, y: 474, width: 420, height: 130 }
  - id: static_lock
    label: "静止锁与生命周期\nscore-gated regime switch\nlockedPose / CUSUM / drift leash / head settle"
    type: process
    module: unity_runtime
    bounds: { x: 1270, y: 630, width: 420, height: 92 }
  - id: dynamic_anchor
    label: DynamicObjectAnchor 输出 Transform
    type: terminal
    module: unity_runtime
    bounds: { x: 1345, y: 742, width: 270, height: 52 }

  - id: protocol
    label: "EgoAnchor_Protocol\nproto + subjects.v1.json → 双端生成代码"
    type: document
    module: support
    bounds: { x: 115, y: 920, width: 360, height: 74 }
  - id: eval_tools
    label: "AnchorEvalRecorder + Tools3\ncapture/render JSONL，60 fps 离线仿真"
    type: document
    module: support
    bounds: { x: 555, y: 920, width: 400, height: 74 }
  - id: metrics
    label: "锚点质量指标\nworld error / jitter / slip / latency / recovery"
    type: document
    module: support
    bounds: { x: 1035, y: 920, width: 330, height: 74 }
  - id: comparison
    label: "论文对比主线\nArrival-time vs Frame-aligned vs EgoAnchor"
    type: document
    module: support
    bounds: { x: 1445, y: 920, width: 240, height: 74 }

edges:
  - from: stereo_frame
    to: quest_stream_publisher
    type: primary
  - from: camera_info
    to: quest_stream_publisher
    type: primary
  - from: quest_stream_publisher
    to: quest_stream_receiver
    type: data
    label: ZMQ 数据面: QuestStereoFrame / QuestCameraInfo
  - from: quest_stream_receiver
    to: quest_calibration
    type: primary
  - from: quest_stream_receiver
    to: pose_pipeline
    type: primary
  - from: quest_calibration
    to: pose_pipeline
    type: primary
  - from: pose_pipeline
    to: pose_score
    type: primary
  - from: pose_score
    to: tracking_runtime
    type: primary
  - from: tracking_runtime
    to: pose_receiver
    type: data
    label: NATS 消息面: PoseResult / Status / Heartbeat
  - from: pose_receiver
    to: anchor_runtime_hub
    type: primary
  - from: anchor_runtime_hub
    to: frame_aligner
    type: primary
  - from: frame_pose_history
    to: frame_aligner
    type: primary
    label: 核心路径: 按 frame_id 精确回查采集时刻相机世界位姿
  - from: frame_aligner
    to: anchor_policy_host
    type: primary
  - from: anchor_policy_host
    to: static_lock
    type: primary
  - from: static_lock
    to: dynamic_anchor
    type: primary
  - from: anchor_runtime_hub
    to: tracking_runtime
    type: optional
    label: NATS 命令面: reset / reacquire / control
  - from: protocol
    to: quest_stream_publisher
    type: optional
  - from: protocol
    to: tracking_runtime
    type: optional
  - from: protocol
    to: pose_receiver
    type: optional
  - from: tracking_runtime
    to: eval_tools
    type: optional
  - from: dynamic_anchor
    to: eval_tools
    type: optional
  - from: eval_tools
    to: metrics
    type: primary
  - from: metrics
    to: comparison
    type: primary
