<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">EgoAnchor 中文系统架构图</title>
  <desc id="desc">展示 Quest 采集、Python 视觉计算、Unity 锚定运行时、三平面通信、frame_id 帧对齐回查、协议与离线评估支撑。</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5B8DB8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6DAF91"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C9933F"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8A96A3"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #22313f; }
      .subtitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 17px; fill: #52616f; }
      .lane { fill: #fcfdfe; stroke-width: 1.5; }
      .lane-blue { stroke: #b8cedf; }
      .lane-green { stroke: #b8d8c9; }
      .lane-amber { stroke: #dec79a; }
      .support { fill: #ffffff; stroke: #d7dde4; stroke-width: 1.5; }
      .lane-title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #263238; }
      .section-note { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 13px; fill: #6b7785; }
      .box { fill: #ffffff; stroke-width: 1.6; }
      .blue-box { stroke: #7ba7c7; }
      .green-box { stroke: #75b89d; }
      .amber-box { stroke: #cfa04f; }
      .gray-box { stroke: #aeb7c2; }
      .emph-box { fill: #fffdf8; stroke: #c9933f; stroke-width: 2.4; }
      .box-title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #263238; }
      .box-text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 13.5px; fill: #52616f; }
      .tiny { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 12px; fill: #6b7785; }
      .chip { fill: #ffffff; stroke: #d4dbe3; stroke-width: 1.1; }
      .chip-text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 12.5px; fill: #44515f; }
      .formula { font-family: "Times New Roman", "Microsoft YaHei", serif; font-size: 16px; fill: #2d3a45; }
      .edge-label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 13px; fill: #45525f; }
      .edge-label-bg { fill: #ffffff; stroke: #d8dee6; stroke-width: 1; }
      .blue-edge { fill: none; stroke: #5b8db8; stroke-width: 2.6; stroke-dasharray: 10 7; marker-end: url(#arrowBlue); }
      .green-edge { fill: none; stroke: #6daf91; stroke-width: 2.6; stroke-dasharray: 10 7; marker-end: url(#arrowGreen); }
      .amber-edge { fill: none; stroke: #c9933f; stroke-width: 2.4; stroke-dasharray: 10 5 2 5; marker-end: url(#arrowAmber); }
      .core-edge { fill: none; stroke: #c9933f; stroke-width: 4.2; marker-end: url(#arrowAmber); }
      .gray-edge { fill: none; stroke: #8a96a3; stroke-width: 1.7; stroke-dasharray: 3 5; marker-end: url(#arrowGray); }
      .solid-edge { fill: none; stroke: #7b8794; stroke-width: 1.7; marker-end: url(#arrowGray); }
      .icon-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-blue { stroke: #6f9dbc; }
      .icon-green { stroke: #68a98a; }
      .icon-amber { stroke: #bd8b38; }
      .icon-gray { stroke: #8793a0; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1080"/>

  <text class="title" x="70" y="50">EgoAnchor: 帧对齐真实物体锚定系统</text>
  <text class="subtitle" x="70" y="80">低频异步相机坐标系 6DoF 位姿流 → 高频、世界一致、稳定可恢复的 MR 锚点</text>

  <g id="capability-chips">
    <rect class="chip" x="1165" y="34" width="106" height="30" rx="15"/>
    <text class="chip-text" x="1218" y="54" text-anchor="middle">免主动深度</text>
    <rect class="chip" x="1283" y="34" width="96" height="30" rx="15"/>
    <text class="chip-text" x="1331" y="54" text-anchor="middle">任意物体</text>
    <rect class="chip" x="1391" y="34" width="96" height="30" rx="15"/>
    <text class="chip-text" x="1439" y="54" text-anchor="middle">允许运动</text>
    <rect class="chip" x="1499" y="34" width="116" height="30" rx="15"/>
    <text class="chip-text" x="1557" y="54" text-anchor="middle">低成本模型</text>
    <rect class="chip" x="1627" y="34" width="96" height="30" rx="15"/>
    <text class="chip-text" x="1675" y="54" text-anchor="middle">开放硬件</text>
  </g>

  <!-- Main lanes -->
  <rect class="lane lane-blue" x="70" y="115" width="500" height="665" rx="10"/>
  <rect class="lane lane-green" x="650" y="115" width="500" height="665" rx="10"/>
  <rect class="lane lane-amber" x="1230" y="115" width="500" height="665" rx="10"/>

  <text class="lane-title" x="100" y="148">Quest 3 / Unity 采集端</text>
  <text class="section-note" x="100" y="170">采集图像，同时缓存采集时刻相机世界位姿</text>
  <text class="lane-title" x="680" y="148">外部视觉计算 / Python</text>
  <text class="section-note" x="680" y="170">仅估计物体相机坐标系位姿，不输出世界锚点</text>
  <text class="lane-title" x="1260" y="148">Unity 锚定运行时</text>
  <text class="section-note" x="1260" y="170">frame_id 对齐、策略升采样、应用 Transform</text>

  <!-- Left lane nodes -->
  <rect class="box blue-box" x="105" y="195" width="195" height="78" rx="8"/>
  <g transform="translate(122 214)">
    <rect class="icon-line icon-blue" x="0" y="8" width="34" height="22" rx="4"/>
    <circle class="icon-line icon-blue" cx="17" cy="19" r="7"/>
    <path class="icon-line icon-blue" d="M7 8 L12 2 H23 L28 8"/>
  </g>
  <text class="box-title" x="168" y="225">双目透视帧</text>
  <text class="box-text" x="168" y="247">left / right RGB</text>
  <text class="tiny" x="168" y="264">frame_id, capture time</text>

  <rect class="box blue-box" x="335" y="195" width="190" height="78" rx="8"/>
  <g transform="translate(352 214)">
    <path class="icon-line icon-blue" d="M5 6 H35 V30 H5 Z"/>
    <path class="icon-line icon-blue" d="M12 13 H28 M12 21 H28"/>
  </g>
  <text class="box-title" x="407" y="225">相机信息</text>
  <text class="box-text" x="407" y="247">内参 K</text>
  <text class="tiny" x="407" y="264">lens pose</text>

  <rect class="emph-box" x="155" y="315" width="330" height="98" rx="8"/>
  <g transform="translate(178 337)">
    <path class="icon-line icon-amber" d="M4 9 C4 3 46 3 46 9 V38 C46 44 4 44 4 38 Z"/>
    <path class="icon-line icon-amber" d="M4 9 C4 15 46 15 46 9"/>
    <path class="icon-line icon-amber" d="M4 24 C4 30 46 30 46 24"/>
  </g>
  <text class="box-title" x="245" y="343">帧姿态历史</text>
  <text class="formula" x="245" y="368">frame_id → T<tspan baseline-shift="super" font-size="11">W</tspan><tspan baseline-shift="sub" font-size="11">C</tspan>(t<tspan baseline-shift="sub" font-size="11">i</tspan>)</text>
  <text class="tiny" x="245" y="393">采集时刻 left / right / center camera pose</text>

  <path class="solid-edge" d="M300 234 H335"/>
  <path class="solid-edge" d="M250 273 V315"/>
  <path class="solid-edge" d="M430 273 V315"/>

  <rect class="box blue-box" x="185" y="452" width="285" height="84" rx="8"/>
  <g transform="translate(208 474)">
    <path class="icon-line icon-blue" d="M4 10 H36 V34 H4 Z"/>
    <path class="icon-line icon-blue" d="M12 18 H28 M12 26 H28"/>
    <path class="icon-line icon-blue" d="M42 12 L56 22 L42 32"/>
  </g>
  <text class="box-title" x="282" y="482">QuestStreamPublisher</text>
  <text class="box-text" x="282" y="505">Protobuf bytes</text>
  <text class="tiny" x="282" y="523">ZMQ PUB, latest-only</text>
  <path class="solid-edge" d="M320 413 V452"/>

  <rect class="box gray-box" x="125" y="585" width="390" height="105" rx="8"/>
  <text class="box-title" x="154" y="617">参考相机世界位姿</text>
  <text class="box-text" x="154" y="642">来自头显自身跟踪</text>
  <text class="box-text" x="154" y="665">“纯视觉”只修饰物体位姿估计链路</text>

  <!-- Center lane nodes -->
  <rect class="box green-box" x="690" y="195" width="205" height="78" rx="8"/>
  <g transform="translate(710 215)">
    <path class="icon-line icon-green" d="M4 10 H38 V32 H4 Z"/>
    <path class="icon-line icon-green" d="M10 17 H30 M10 25 H30"/>
  </g>
  <text class="box-title" x="765" y="225">最新帧接收</text>
  <text class="box-text" x="765" y="248">decode / dedup</text>
  <text class="tiny" x="765" y="265">QuestStreamReceiver</text>

  <rect class="box green-box" x="930" y="195" width="180" height="78" rx="8"/>
  <g transform="translate(948 217)">
    <path class="icon-line icon-green" d="M8 28 L20 8 L32 28 Z"/>
    <path class="icon-line icon-green" d="M20 8 V34"/>
  </g>
  <text class="box-title" x="1004" y="225">标定映射</text>
  <text class="box-text" x="1004" y="248">camera_info → K</text>
  <text class="tiny" x="1004" y="265">crop / scale</text>
  <path class="solid-edge" d="M895 234 H930"/>

  <rect class="box green-box" x="690" y="322" width="420" height="182" rx="8"/>
  <text class="box-title" x="718" y="350">视觉位姿流水线</text>
  <text class="tiny" x="718" y="371">QuestPosePipeline: camera-space object pose</text>
  <rect class="chip" x="718" y="392" width="170" height="34" rx="17"/>
  <text class="chip-text" x="803" y="414" text-anchor="middle">分割 YOLOE / SAM3</text>
  <rect class="chip" x="918" y="392" width="160" height="34" rx="17"/>
  <text class="chip-text" x="998" y="414" text-anchor="middle">双目深度 FFS</text>
  <rect class="chip" x="718" y="446" width="170" height="34" rx="17"/>
  <text class="chip-text" x="803" y="468" text-anchor="middle">FoundationPose 注册</text>
  <rect class="chip" x="918" y="446" width="160" height="34" rx="17"/>
  <text class="chip-text" x="998" y="468" text-anchor="middle">Track + Cutie</text>
  <path class="solid-edge" d="M795 273 V322"/>
  <path class="solid-edge" d="M1020 273 V322"/>

  <rect class="box green-box" x="690" y="540" width="420" height="112" rx="8"/>
  <g transform="translate(718 562)">
    <path class="icon-line icon-green" d="M20 2 L38 10 V24 C38 35 29 43 20 47 C11 43 2 35 2 24 V10 Z"/>
    <path class="icon-line icon-green" d="M11 24 L18 31 L31 16"/>
  </g>
  <text class="box-title" x="770" y="570">渲染质量与可靠性评分</text>
  <text class="formula" x="770" y="596">R = Gate × Quality × Confidence</text>
  <text class="tiny" x="770" y="619">颜色重投影 / 深度对齐 / mask 调制 / warmup</text>
  <text class="tiny" x="770" y="637">无有效颜色或深度信号时不硬惩罚</text>
  <path class="solid-edge" d="M900 504 V540"/>

  <rect class="box green-box" x="740" y="690" width="320" height="64" rx="8"/>
  <text class="box-title" x="900" y="716" text-anchor="middle">TrackingRuntime</text>
  <text class="tiny" x="900" y="738" text-anchor="middle">持有 pipeline / GPU 状态，发布 PoseResult</text>
  <path class="solid-edge" d="M900 652 V690"/>

  <!-- Right lane nodes -->
  <rect class="box amber-box" x="1270" y="195" width="205" height="78" rx="8"/>
  <g transform="translate(1292 215)">
    <path class="icon-line icon-amber" d="M4 10 H38 V32 H4 Z"/>
    <path class="icon-line icon-amber" d="M10 17 H30 M10 25 H30"/>
  </g>
  <text class="box-title" x="1350" y="225">Pose 接收</text>
  <text class="box-text" x="1350" y="248">latest drain</text>
  <text class="tiny" x="1350" y="265">NatsControlClient</text>

  <rect class="box amber-box" x="1510" y="195" width="175" height="78" rx="8"/>
  <g transform="translate(1528 216)">
    <circle class="icon-line icon-amber" cx="18" cy="18" r="13"/>
    <path class="icon-line icon-amber" d="M18 5 V18 L29 24"/>
  </g>
  <text class="box-title" x="1595" y="225" text-anchor="middle">运行时 Hub</text>
  <text class="tiny" x="1595" y="248" text-anchor="middle">fan-out / fan-in</text>
  <text class="tiny" x="1595" y="265" text-anchor="middle">低分重获取汇总</text>
  <path class="solid-edge" d="M1475 234 H1510"/>

  <rect class="emph-box" x="1315" y="318" width="350" height="112" rx="8"/>
  <text class="box-title" x="1490" y="346" text-anchor="middle">帧对齐世界锚定</text>
  <text class="formula" x="1490" y="375" text-anchor="middle">T<tspan baseline-shift="super" font-size="11">W</tspan><tspan baseline-shift="sub" font-size="11">O</tspan>(t<tspan baseline-shift="sub" font-size="11">i</tspan>) = T<tspan baseline-shift="super" font-size="11">W</tspan><tspan baseline-shift="sub" font-size="11">C</tspan>(t<tspan baseline-shift="sub" font-size="11">i</tspan>) · T<tspan baseline-shift="super" font-size="11">C</tspan><tspan baseline-shift="sub" font-size="11">O</tspan>(t<tspan baseline-shift="sub" font-size="11">i</tspan>)</text>
  <text class="tiny" x="1490" y="403" text-anchor="middle">CameraPoseFrameAligner + FramePoseHistory</text>
  <path class="solid-edge" d="M1372 273 V318"/>
  <path class="solid-edge" d="M1595 273 V318"/>

  <rect class="box amber-box" x="1270" y="474" width="420" height="130" rx="8"/>
  <text class="box-title" x="1300" y="503">AnchorPolicyHost</text>
  <text class="tiny" x="1300" y="524">低频观测 → 每渲染帧输出</text>
  <rect class="chip" x="1300" y="542" width="145" height="32" rx="16"/>
  <text class="chip-text" x="1372" y="563" text-anchor="middle">运动模型 3 类</text>
  <rect class="chip" x="1460" y="542" width="145" height="32" rx="16"/>
  <text class="chip-text" x="1532" y="563" text-anchor="middle">平滑策略 3 类</text>
  <rect class="chip" x="1620" y="542" width="50" height="32" rx="16"/>
  <text class="chip-text" x="1645" y="563" text-anchor="middle">Gate</text>
  <text class="tiny" x="1300" y="591">FSM: Searching / Tracking / Coasting / Lost</text>
  <path class="solid-edge" d="M1490 430 V474"/>

  <rect class="box amber-box" x="1270" y="630" width="420" height="92" rx="8"/>
  <g transform="translate(1298 652)">
    <path class="icon-line icon-amber" d="M20 4 V38"/>
    <path class="icon-line icon-amber" d="M8 18 H32"/>
    <path class="icon-line icon-amber" d="M12 38 H28"/>
    <circle class="icon-line icon-amber" cx="20" cy="18" r="8"/>
  </g>
  <text class="box-title" x="1352" y="658">静止锁与生命周期</text>
  <text class="tiny" x="1352" y="681">score-gated regime switch，不是低通滤波</text>
  <text class="tiny" x="1352" y="701">lockedPose / CUSUM / drift leash / head settle</text>
  <path class="solid-edge" d="M1480 604 V630"/>

  <rect class="box amber-box" x="1345" y="742" width="270" height="52" rx="26"/>
  <text class="box-title" x="1480" y="774" text-anchor="middle">DynamicObjectAnchor 输出 Transform</text>
  <path class="solid-edge" d="M1480 722 V742"/>

  <!-- Cross-lane communication arrows -->
  <path class="blue-edge" d="M470 494 H585 V234 H690"/>
  <rect class="edge-label-bg" x="503" y="450" width="170" height="42" rx="6"/>
  <text class="edge-label" x="588" y="468" text-anchor="middle">ZMQ 数据面</text>
  <text class="tiny" x="588" y="486" text-anchor="middle">Frame / CameraInfo</text>

  <path class="green-edge" d="M1060 722 H1185 V234 H1270"/>
  <rect class="edge-label-bg" x="1085" y="673" width="170" height="42" rx="6"/>
  <text class="edge-label" x="1170" y="691" text-anchor="middle">NATS 消息面</text>
  <text class="tiny" x="1170" y="709" text-anchor="middle">Pose / Status / Heartbeat</text>

  <path class="amber-edge" d="M1510 722 H1190 V754 H1060"/>
  <rect class="edge-label-bg" x="1198" y="732" width="190" height="42" rx="6"/>
  <text class="edge-label" x="1293" y="750" text-anchor="middle">NATS 命令面</text>
  <text class="tiny" x="1293" y="768" text-anchor="middle">reset / reacquire / control</text>

  <!-- Core frame_id lookup arrow -->
  <path class="core-edge" d="M320 315 V126 H1490 V318"/>
  <rect class="edge-label-bg" x="706" y="112" width="420" height="30" rx="15"/>
  <text class="edge-label" x="916" y="132" text-anchor="middle">核心路径: 按 frame_id 精确回查采集时刻相机世界位姿</text>

  <!-- Bottom support band -->
  <rect class="support" x="70" y="835" width="1660" height="185" rx="10"/>
  <text class="lane-title" x="100" y="870">协议与离线评估支撑</text>
  <text class="section-note" x="100" y="892">支撑在线系统，但不把离线评估画入实时闭环</text>

  <rect class="box gray-box" x="115" y="920" width="360" height="74" rx="8"/>
  <g transform="translate(140 939)">
    <path class="icon-line icon-gray" d="M6 2 H32 L44 14 V42 H6 Z"/>
    <path class="icon-line icon-gray" d="M32 2 V14 H44"/>
  </g>
  <text class="box-title" x="205" y="948">EgoAnchor_Protocol</text>
  <text class="tiny" x="205" y="970">proto + subjects.v1.json → Python / Unity 生成代码</text>

  <rect class="box gray-box" x="555" y="920" width="400" height="74" rx="8"/>
  <text class="box-title" x="755" y="948" text-anchor="middle">AnchorEvalRecorder + Tools3</text>
  <text class="tiny" x="755" y="970" text-anchor="middle">capture/render JSONL，latency-aware 60 fps 离线仿真</text>

  <rect class="box gray-box" x="1035" y="920" width="330" height="74" rx="8"/>
  <text class="box-title" x="1200" y="948" text-anchor="middle">锚点质量指标</text>
  <text class="tiny" x="1200" y="970" text-anchor="middle">world error / jitter / slip / latency / recovery</text>

  <rect class="box gray-box" x="1445" y="920" width="240" height="74" rx="8"/>
  <text class="box-title" x="1565" y="948" text-anchor="middle">论文对比主线</text>
  <text class="tiny" x="1565" y="970" text-anchor="middle">Arrival-time vs Frame-aligned vs EgoAnchor</text>

  <path class="gray-edge" d="M295 920 V690"/>
  <path class="gray-edge" d="M295 920 C430 830 720 830 900 754"/>
  <path class="gray-edge" d="M295 920 C650 820 1180 820 1372 273"/>
  <path class="gray-edge" d="M900 754 V920 H755"/>
  <path class="gray-edge" d="M1480 794 V858 H955"/>
  <path class="solid-edge" d="M955 957 H1035"/>
  <path class="solid-edge" d="M1365 957 H1445"/>
</svg>
