# Mutagen project file — syncs this machine (the authoritative source) with the
# three GPU test boxes. Manage all six sessions together as one project.
#
#   push-*  : mirror local source -> each machine        (one-way-replica)
#             Local is the SINGLE source of truth. Remote-side edits to tracked
#             source files are OVERWRITTEN on the next sync. Ignored dirs
#             (.pixi / weights / data/eval / runtime logs / nats) are untouched.
#   logs-*  : pull each machine's data/eval back          (one-way-safe)
#             -> local data/eval/ (shared; remote authoritative). All three
#             machines pull into the SAME local dir — safe because each run's
#             session dir is uniquely timestamped, so they never collide, and
#             one-way-safe never deletes local-only content.
#
#   Start:   mutagen project start        (run from this directory)
#   Status:  mutagen project list  |  mutagen sync list  |  mutagen sync monitor
#   Stop:    mutagen project terminate
#   Reset:   mutagen project reset        (flush + re-sync from scratch)
#
# Targets:
#   4090  johnren@172.24.244.55  /home/johnren/tmp/EgoAnchor_Python      (Linux)
#   5090  BNU@172.24.247.32      D:/Project/EgoAnchor_Python             (Windows)
#   5080  gjw@192.168.3.9        C:/Users/gjw/projects/EgoAnchor_Python  (Windows)
#
# !! VERIFY the 5090 IP (172.24.247.32) after Windows reinstall.
#    Run `ipconfig` on the 5090 and check the "IPv4 Address" line.
#
# NOTE: mutagen does NOT read .gitignore — the ignore list below is maintained by
# hand. Keep it in sync with .gitignore when you add generated/large dirs.

sync:
  defaults:
    ignore:
      vcs: true # skip the .git directory on every session

  # ============================ SOURCE PUSH ============================
  # Local -> remote, one direction only. Remote is a replica of local.

  # push-5090:
  #   alpha: "."
  #   beta: "BNU@172.24.247.32:D:/Project/EgoAnchor_Python"
  #   mode: one-way-replica
  #   ignore:
      

  # push-4090:
  #   alpha: "."
  #   beta: "johnren@172.24.244.55:/home/johnren/tmp/EgoAnchor_Python"
  #   mode: one-way-replica
  #   ignore:
  #     paths: *source_ignore

  # --- 5080 DISABLED until its Chinese-locale UTF-8 handshake is fixed ---
  # On a Chinese (GBK/936) Windows box, "remote did not return UTF-8 output" is a
  # SECONDARY error: the agent bootstrap already failed, and mutagen's attempt to
  # read the remote stderr trips utf8.Valid() on the GBK bytes. TWO root causes,
  # both must be fixed (verified 2026-07-09 on the 5090 Win11 migration):
  #   1. HKLM\SOFTWARE\OpenSSH\DefaultShell MUST be cmd.exe, NOT PowerShell.
  #      Mutagen bootstraps the agent via a RELATIVE-PATH command
  #      (.mutagen/agents/<ver>/mutagen-agent synchronizer); cmd.exe runs it,
  #      PowerShell rejects it ("is not recognized as ... cmdlet"). See GitHub
  #      issues #251/#252 — the community fix is cmd.exe. Then Restart-Service sshd.
  #        reg add "HKLM\SOFTWARE\OpenSSH" /v DefaultShell /t REG_SZ ^
  #          /d "C:\Windows\System32\cmd.exe" /f
  #   2. Enable system-wide UTF-8 (Settings > Language > Administrative language
  #      settings > "Beta: Use Unicode UTF-8"; needs a reboot) so codepage 936 no
  #      longer mangles any output into the handshake's first line.
  # WRONG OLD NOTE (retracted): the earlier "switch cmd.exe -> PowerShell" advice
  # was backwards — PowerShell as DefaultShell is what BREAKS the agent bootstrap.
  # Then un-comment the two 5080 blocks below and re-run `mutagen project start`.
  
  push-5080:
    alpha: "."
    beta: "gjw@192.168.3.9:D:/Projects/EgoAnchor_Python"
    mode: one-way-replica
    ignore:
      # paths: *source_ignore
      paths: &source_ignore
        # --- python / tooling caches ---
        - "*.pyc"
        - "*.pyo"
        - "__pycache__/"
        - ".venv/"
        - "/.pixi/" # ~17 GB conda/pixi env — rebuilt on remote via `pixi install`
        - "/.mypy_cache/"
        - "/.pycache_compile/"
        - "/build/"
        - "/dist/"
        - "/wheels/"
        - "*.egg-info/"
        - "/logs/" # SLURM stdout/stderr — stays per-machine
        # --- pulled-back eval logs are remote-authoritative; never push them out
        #     (replica would delete each box's own fresh eval runs) ---
        - "/data/eval/"
        # --- model weights (rebuilt/downloaded on remote) ---
        - "*.pt"
        - "*.pth"
        - "*.onnx"
        - "*.engine"
        - "*.plan"
        - "/weights/"
        - "/Cutie/weights/"
        - "/FoundationPose/weights/"
        - "/FoundationPose/demo_data/"
        - "/sam3/assets/sam3_ckpt/"
        # --- generated runtime outputs ---
        - "/Fast-FoundationStereo/output_docker/"
        - "/data/debug/"
        - "/data/runtime_logs/" # per-machine debug logs; not collected
        - "/data/online/*/output/"
        - "/Calibration/cache/"
        # --- misc large downloads present only on remote ---
        - "*.tar.gz"
        - "/nats-server-*"
        # --- remote-side build artifacts (platform-specific, never sync) ---
        - "/FoundationPose/mycpp/build/"
        - "*.o"
        - "*.so"
        - "a.out"
        # --- the sync config itself stays local-only ---
        - "/mutagen.yml"
        - "/mutagen.yml.lock"

  # ============================ EVAL-LOG PULL ============================
  # Remote data/eval -> local data/eval (shared dir for all machines).
  # one-way-safe: remote is authoritative; we never write back to the machines,
  # and local-only content is never deleted. Run session dirs are uniquely
  # timestamped, so the three machines' pulls never collide.

  # logs-4090:
  #   alpha: "johnren@172.24.244.55:/home/johnren/tmp/EgoAnchor_Python/data/eval"
  #   beta: "./data/eval"
  #   mode: one-way-safe

  # logs-5090:
  #   alpha: "BNU@172.24.247.32:D:/Project/EgoAnchor_Python/data/eval"
  #   beta: "./data/eval"
  #   mode: one-way-safe

  logs-5080:
    alpha: "gjw@192.168.3.9:D:/Projects/EgoAnchor_Python/data/eval"
    beta: "./data/eval"
    mode: one-way-safe
