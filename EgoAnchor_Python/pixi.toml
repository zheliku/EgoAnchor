[workspace]
authors = ["zheliku <302734905@qq.com>"]
channels = ["https://prefix.dev/conda-forge", "conda-forge"]
name = "EgoAnchor_Python"
# 不在 platforms 内联 cuda，避免 pixi 生成 win-64-cuda-* 平台名并影响 PyPI 构建隔离。
# Windows CUDA 拆成精确组件声明；Linux 使用 cuda-toolkit。
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[target.win-64.activation.env]
# Windows 只放静态项目环境；MSVC 动态激活在 _build-nvdiffrast 内手动刷新。
PYTHONPATH = ".;src;Fast-FoundationStereo;Cutie;sam3" # Windows 静态 import 路径；Pixi task 默认在项目根目录执行。
SSL_CERT_DIR = ".pixi/envs/default/Library/ssl" # 覆盖 conda OpenSSL 可能注入的空 certs 子目录。
CUDA_HOME = ".pixi/envs/default/Library" # Windows conda CUDA 组件位于 Library 子目录；构建 task 会再用 %CONDA_PREFIX% 刷成绝对路径。
CUDA_PATH = ".pixi/envs/default/Library" # 兼容依赖 CUDA_PATH 的 CUDA/PyTorch 构建探测；构建 task 会再用 %CONDA_PREFIX% 刷成绝对路径。
CL = "/I.pixi/envs/default/Library/include/targets/x64 /I.pixi/envs/default/Library/include/targets/x64/cccl" # 给普通 Windows 任务兜底补充 CUDA 13 CCCL include 路径。
TORCH_DONT_CHECK_COMPILER_ABI = "1" # Windows 上跳过 PyTorch 对 MSVC ABI 版本的保守检查。
PYTHONIOENCODING = "utf-8" # 固定 Python 标准流编码，避免中文路径/日志乱码。
PYTHONUTF8 = "1" # 强制 Python UTF-8 模式。
DISTUTILS_USE_SDK = "1" # 告诉 distutils 复用已激活的 MSVC SDK 环境。

[target.linux-64.activation.env]
# 与 Windows 保持同一 import 布局；路径分隔符换为 Linux 的冒号。
PYTHONPATH = "$PIXI_PROJECT_ROOT:$PIXI_PROJECT_ROOT/src:$PIXI_PROJECT_ROOT/Fast-FoundationStereo:$PIXI_PROJECT_ROOT/Cutie:$PIXI_PROJECT_ROOT/sam3"
# 覆盖 conda OpenSSL 可能注入的空 certs 子目录。
SSL_CERT_DIR = "$CONDA_PREFIX/ssl"
# Linux 的 conda CUDA Toolkit 根目录就是环境根目录。
CUDA_HOME = "$CONDA_PREFIX"
CUDA_PATH = "$CONDA_PREFIX"
# Triton/torch 运行时编译 CUDA 模块时需要能链接到 libcuda stub。
LIBRARY_PATH = "$CONDA_PREFIX/lib/stubs"

[dependencies]
python = "3.13.*"
pip = ">=25.3,<26" # 在 pixi run 激活环境内安装 nvdiffrast 源码扩展。
cmake = ">=4.1.2,<5"
boost = ">=1.82.0,<2"
eigen = ">=3.4.0,<4"
ninja = ">=1.13.1,<2"
psutil = ">=7.1.0,<8"
pybind11 = ">=3.0.1,<4"
pythran = ">=0.18.1,<0.19" # Cython 构建 nvdiffrast 时会探测 pythran；只存在残缺 namespace 会触发 AttributeError: pythran.__version__。
numpy = ">=2,<3"
scipy = ">=1.17.0,<2"
netifaces = ">=0.11.0,<0.12"
pandas = ">=3.0.0,<4"
h5py = ">=3.15.1,<4"
omegaconf = ">=2.3.0,<3"
transformations = ">=2022.9.26,<2023"
hydra-core = ">=1.3.2,<2"
joblib = ">=1.5.3,<2"
scikit-learn = ">=1.8.0,<2"
ftfy = ">=6.3.1,<7"
regex = ">=2026.1.15,<2027"
iopath = ">=0.1.10,<0.2"
ruamel = ">=1.0,<2"
"ruamel.yaml" = ">=0.19.1,<0.20"
setuptools = ">=69.0.0,<75"
einops = ">=0.8.2,<0.9"

[pypi-dependencies]
# PyTorch 使用 cu130 wheel；pytorch3d wheel 绑定 torch 2.12.0/cu130。
torch = { version = "==2.12.0", index = "https://download.pytorch.org/whl/cu130" }
torchvision = { version = "==0.27.0", index = "https://download.pytorch.org/whl/cu130" }
timm = ">=1.0.25, <2"
kornia = ">=0.8.2"
pytorch3d = { version = "==0.7.9+d9839a9pt2.12.0cu130", index = "https://miropsota.github.io/torch_packages_builder" }
warp-lang = ">=1.14.0, <2"
kaolin = ">=0.1, <0.2"
zmq = ">=0.0.0, <0.0.1"
# nvdiffrast 不放这里：pixi install 的 PyPI 源码构建上下文不能可靠安装/刷新系统 MSVC。
# 改由 pixi run 下的 _build-nvdiffrast 任务手动刷新 vs2022_win-64 activation 后安装，见下方 [tasks]。
cutie = { path = "./Cutie", editable = true }
pyrealsense2 = ">=2.56.5,<3"
pillow = ">=12, <13"
matplotlib = ">=3.11, <4"
imageio = ">=2.37.0, <3"
scikit-image = "*"
# 项目需要 cv2.imshow，固定在 OpenCV 4.x GUI wheel。
opencv-python = ">=4.13.0.92, <5"
pyyaml = "*"
pycocotools = ">=2.0.11, <3"
pyrender = ">=0.1.45, <0.2"
ultralytics = ">=8.4.84, <9"
onnx = ">=1.21.0, <2"
onnxscript = ">=0.5.0, <1"
nats-py = ">=2.12.0, <3"
clip = { git = "https://github.com/ultralytics/CLIP.git" }
tensorrt-cu13 = ">=10.16.1.11, <12"
protobuf = ">=7.34.1, <8"

# nvdiffrast 不再走 pixi install 的 PyPI 构建；改由 pixi run 下的 _build-nvdiffrast 任务用
# `python -m pip install --no-build-isolation --no-deps` 在激活环境里安装。

# open3d 稳定版暂无 Python 3.13 wheel；暂用官方 main-devel 预发布 wheel。
[target.win-64.pypi-dependencies]
open3d = { url = "https://github.com/isl-org/Open3D/releases/download/main-devel/open3d-0.19.0%2Bfe3af4b-cp313-cp313-win_amd64.whl" }
# 官方 triton 仍无 Windows wheel；这里用支持 cp313 的 triton-windows 分叉。
triton-windows = ">=3.7.1.post27, <4"

[target.linux-64.pypi-dependencies]
open3d = { url = "https://github.com/isl-org/Open3D/releases/download/main-devel/open3d-0.19.0-cp313-cp313-manylinux_2_35_x86_64.whl" }

[target.win-64.dependencies]
gcc_win-64 = ">=15.2.0,<16"
gxx_win-64 = ">=15.2.0,<16"
vs2022_win-64 = ">=19.44,<20" # 提供 vswhere 和 MSVC activate.d 脚本；Build Tools 本体仍由 _ensure-msvc-buildtools 检查/安装。
# Windows 避免 cuda-toolkit 总包拉入冲突的 VS 激活包，只声明 nvcc、运行库和开发头/库。
cuda-nvcc_win-64 = "13.3.*"
cuda-libraries = "13.3.*"
cuda-libraries-dev = "13.3.*"

[target.linux-64.dependencies]
# conda CUDA 组件使用 13.3；PyTorch wheel 使用 cu130 标签，两者不是同一个版本字段。
cuda-toolkit = "13.3.*"
gcc_linux-64 = "11.*"
gxx_linux-64 = "11.*"

[target.win-64.tasks]
_ensure-msvc-buildtools = { cmd = """
pwsh -NoProfile -ExecutionPolicy Bypass -Command '$ErrorActionPreference = "Stop"; $findVs = { $paths = @(); $vswhere = Get-Command vswhere -ErrorAction SilentlyContinue; if ($vswhere) { $paths += & $vswhere.Source -nologo -products * -version "[17.0,18.0)" -property installationPath; $paths += & $vswhere.Source -nologo -latest -property installationPath }; $paths += Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/2022/BuildTools"; $paths += Join-Path $env:ProgramFiles "Microsoft Visual Studio/2022/BuildTools"; foreach ($path in $paths) { if ($path -and (Test-Path -LiteralPath (Join-Path $path "VC/Auxiliary/Build/vcvars64.bat"))) { return $path } }; return $null }; $installPath = & $findVs; if ($installPath) { Write-Host "[egoanchor] VS 2022 C++ Build Tools ready:" $installPath; exit 0 }; $winget = Get-Command winget -ErrorAction SilentlyContinue; if (-not $winget) { throw "[egoanchor] winget 不可用，无法自动安装 VS 2022 Build Tools。请先安装 App Installer 或手动安装 VS2022 C++ Build Tools。" }; Write-Host "[egoanchor] VS 2022 C++ Build Tools missing; installing with winget. Windows may ask for administrator approval."; & winget install --id Microsoft.VisualStudio.2022.BuildTools --exact --source winget --accept-package-agreements --accept-source-agreements --override "--wait --passive --norestart --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"; $wingetExit = $LASTEXITCODE; $installPath = & $findVs; if ($installPath) { Write-Host "[egoanchor] VS 2022 C++ Build Tools installed:" $installPath; exit 0 }; if ($wingetExit -ne 0) { exit $wingetExit }; throw "[egoanchor] VS 2022 Build Tools 安装后仍找不到 vcvars64.bat，请重新打开终端或检查 Visual Studio Installer。"'
""" } # Windows 下内联检查 VS2022 C++ Build Tools；缺失时通过 winget 安装，系统可能弹出管理员确认。

doctor-win-env = { cmd = """
cmd /v:on /d /c "call ""%CONDA_PREFIX%\\etc\\conda\\activate.d\\vs2022_compiler_vars.bat"" >nul&& set CUDA_HOME=%CONDA_PREFIX%\\Library&& set CUDA_PATH=%CONDA_PREFIX%\\Library&& set CL=/I%CONDA_PREFIX%\\Library\\include\\targets\\x64 /I%CONDA_PREFIX%\\Library\\include\\targets\\x64\\cccl&& set CUDAHOSTCXX=cl.exe&& where cl.exe&& where nvcc.exe&& where ninja.exe&& echo CL=!CL!&& echo CC=!CC!&& echo CUDA_HOME=!CUDA_HOME!&& echo CUDA_PATH=!CUDA_PATH!&& echo CUDAHOSTCXX=!CUDAHOSTCXX!&& echo NVCC_PREPEND_FLAGS=!NVCC_PREPEND_FLAGS!"
""" }

_build-nvdiffrast = { depends-on = ["_ensure-msvc-buildtools"], cmd = """
cmd /v:on /d /c "call ""%CONDA_PREFIX%\\etc\\conda\\activate.d\\vs2022_compiler_vars.bat"" >nul&& set CUDA_HOME=%CONDA_PREFIX%\\Library&& set CUDA_PATH=%CONDA_PREFIX%\\Library&& set CL=/I%CONDA_PREFIX%\\Library\\include\\targets\\x64 /I%CONDA_PREFIX%\\Library\\include\\targets\\x64\\cccl&& set CUDAHOSTCXX=cl.exe&& python -m pip install --no-build-isolation --no-deps git+https://github.com/NVlabs/nvdiffrast.git@v0.4.0"
""" } # Windows 下先确保 MSVC Build Tools 可用，再手动刷新 vs2022_win-64 激活环境并编译安装 nvdiffrast。

_build-fp = { cmd = """
cmake -E rm -rf FoundationPose/mycpp/build &&
cmake -S FoundationPose/mycpp -B FoundationPose/mycpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc.exe" "-DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++.exe" &&
cmake --build FoundationPose/mycpp/build --parallel
""" } # Windows 下编译 FoundationPose C++ 扩展；使用 MinGW 编译器绕开 MSVC 与该 CMake 工程的兼容坑。

[tasks]
_build-fp = { cmd = """
cmake -E rm -rf FoundationPose/mycpp/build &&
cmake -S FoundationPose/mycpp -B FoundationPose/mycpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release &&
cmake --build FoundationPose/mycpp/build --parallel
""" } # 编译 FoundationPose C++ 扩展；前导下划线表示内部构建步骤，主线入口走 pixi run build。
# Fast-FoundationStereo 主链路：与 src/egoanchor/config/defaults.toml 的默认
# [module.ffs] 一致（23-36-37、480x640、valid_iters=4、max_disp=192）。
# 无后缀任务只生成这组必要 ONNX/TRT；可选速度/精度档位统一使用 -extra 后缀。
_make-onnx = { cmd = """
python Fast-FoundationStereo/scripts/make_onnx.py --model_dir Fast-FoundationStereo/weights/23-36-37/model_best_bp2_serialize.pth --save_path Fast-FoundationStereo/weights/23-36-37 --height 480 --width 640 --valid_iters 4 --max_disp 192
""" }
_build-trt = { cmd = """
python Fast-FoundationStereo/scripts/build_trt_engine.py --onnx_dir Fast-FoundationStereo/weights/23-36-37 --height 480 --width 640 --valid_iters 4 --max_disp 192 --workspace_gb 4 --precision fp16
""" }
build-trt = { depends-on = ["_make-onnx", "_build-trt"] }

# 可选扩展：用于切换 Fast-FoundationStereo 的速度/精度档位，复刻旧全量构建中的非默认组合。
_make-onnx-extra = { cmd = """
python Fast-FoundationStereo/scripts/make_onnx.py --model_dir Fast-FoundationStereo/weights/20-26-39/model_best_bp2_serialize.pth --save_path Fast-FoundationStereo/weights/20-26-39 --height 480 --width 640 --valid_iters 4 --max_disp 192 &&
python Fast-FoundationStereo/scripts/make_onnx.py --model_dir Fast-FoundationStereo/weights/20-26-39/model_best_bp2_serialize.pth --save_path Fast-FoundationStereo/weights/20-26-39 --height 480 --width 640 --valid_iters 8 --max_disp 192 &&
python Fast-FoundationStereo/scripts/make_onnx.py --model_dir Fast-FoundationStereo/weights/20-30-48/model_best_bp2_serialize.pth --save_path Fast-FoundationStereo/weights/20-30-48 --height 480 --width 640 --valid_iters 4 --max_disp 192 &&
python Fast-FoundationStereo/scripts/make_onnx.py --model_dir Fast-FoundationStereo/weights/20-30-48/model_best_bp2_serialize.pth --save_path Fast-FoundationStereo/weights/20-30-48 --height 480 --width 640 --valid_iters 8 --max_disp 192 &&
python Fast-FoundationStereo/scripts/make_onnx.py --model_dir Fast-FoundationStereo/weights/23-36-37/model_best_bp2_serialize.pth --save_path Fast-FoundationStereo/weights/23-36-37 --height 480 --width 640 --valid_iters 8 --max_disp 192
""" }
_build-trt-extra = { cmd = """
python Fast-FoundationStereo/scripts/build_trt_engine.py --onnx_dir Fast-FoundationStereo/weights/20-26-39 --height 480 --width 640 --valid_iters 4 --max_disp 192 --workspace_gb 4 --precision fp16 &&
python Fast-FoundationStereo/scripts/build_trt_engine.py --onnx_dir Fast-FoundationStereo/weights/20-26-39 --height 480 --width 640 --valid_iters 8 --max_disp 192 --workspace_gb 4 --precision fp16 &&
python Fast-FoundationStereo/scripts/build_trt_engine.py --onnx_dir Fast-FoundationStereo/weights/20-30-48 --height 480 --width 640 --valid_iters 4 --max_disp 192 --workspace_gb 4 --precision fp16 &&
python Fast-FoundationStereo/scripts/build_trt_engine.py --onnx_dir Fast-FoundationStereo/weights/20-30-48 --height 480 --width 640 --valid_iters 8 --max_disp 192 --workspace_gb 4 --precision fp16 &&
python Fast-FoundationStereo/scripts/build_trt_engine.py --onnx_dir Fast-FoundationStereo/weights/23-36-37 --height 480 --width 640 --valid_iters 8 --max_disp 192 --workspace_gb 4 --precision fp16
""" }
build-trt-extra = { depends-on = ["_make-onnx-extra", "_build-trt-extra"] } # 生成 20-26-39、20-30-48 和 23-36-37/it8 的可选 TRT artifacts。

# nvdiffrast 走 pixi run（激活脚本已就位），用 pip 以 --no-build-isolation
# 复用当前 pixi 环境的 torch/CUDA/MSVC 现场编译 CUDA 扩展。
_build-nvdiffrast = { cmd = """
python -m pip install --no-build-isolation --no-deps git+https://github.com/NVlabs/nvdiffrast.git@v0.4.0
""" } # Linux 下直接在 pixi run 激活环境内编译安装 nvdiffrast。

build = { depends-on = ["_build-nvdiffrast", "_build-fp", "build-trt"] }

demo-fp = { cmd = """
python FoundationPose/run_demo.py \
--debug 2
""" }

demo-ffs = { cmd = """
python Fast-FoundationStereo/scripts/run_demo.py \
--model_dir Fast-FoundationStereo/weights/23-36-37/model_best_bp2_serialize.pth \
--left_file Fast-FoundationStereo/demo_data/left.png \
--right_file Fast-FoundationStereo/demo_data/right.png \
--intrinsic_file Fast-FoundationStereo/demo_data/K.txt \
--out_dir Fast-FoundationStereo/output/ \
--remove_invisible 0 \
--denoise_cloud 1  \
--scale 1 \
--get_pc 1 \
--valid_iters 8 \
--max_disp 192 \
--zfar 100 \
""" }

demo-ffs-fast = { cmd = """
python Fast-FoundationStereo/src/realsense_foundationstereo_test.py \
--model_dir Fast-FoundationStereo/weights/20-30-48/model_best_bp2_serialize.pth \
--valid_iters 4 \
""" }

demo-ffs-slow = { cmd = """
python Fast-FoundationStereo/src/realsense_foundationstereo_test.py \
--model_dir Fast-FoundationStereo/weights/23-36-37/model_best_bp2_serialize.pth \
--valid_iters 8 \
""" }

