""" }

test-yoloe26-tool = { cmd = """
python -c "from pathlib import Path; p = Path('tools/yoloe26/yoloe26_mask.py'); assert p.is_file(), p; print(f'{p} exists')"
""" }

default = { cmd = """
python src/run_server.py
""" }

blue_mouse ={ cmd = """
python src/run_server.py --object blue_mouse
""" }

pink_mouse ={ cmd = """
