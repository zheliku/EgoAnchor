# EgoAnchor v2 默认运行配置。
# 说明：v2 与旧主线并行存在；当前 Python pose debug 只本地 OpenCV 显示，不向 Unity 发布 pose。

[server]
run_stage = 4 # Python pose debug 启动阶段：1=输入，2=分割，3=深度，4=完整 pose。

[network.data_plane]
listen_host = "*" # Python ZMQ SUB 绑定地址；Unity/Quest PUB 连接到该地址。
listen_port = 15557 # Unity -> Python v2 数据面端口；不要恢复旧 5557。
receive_hwm = 20 # ZMQ 接收高水位；stereo payload 较大，保留少量缓冲，上层仍 latest-drain。
poll_timeout_ms = 30 # 每次 poll 数据面的最长等待时间，单位毫秒。

[network.control_plane]
enabled = false # NATS 控制面开关；当前 pose debug 阶段保持关闭。
url = "nats://127.0.0.1:4222" # NATS server 地址；后续 PoseResult/Heartbeat/Command 使用。

[pipeline.calibration]
network_calib_update = true # 收到新的 QuestCameraInfo 且标定变化时刷新 K/FoundationPose。
assume_center_crop = true # K 映射方式：true=中心裁剪+缩放，false=仅线性缩放。
process_width = 640 # 算法处理图像宽度；<=0 时使用 camera_info 标定宽度。
process_height = 480 # 算法处理图像高度；<=0 时使用 camera_info 标定高度。

[pipeline.depth]
min_depth = 0.1 # 有效深度下限，单位米；低于该值会置零并拒绝异常 pose。
max_depth = 3.0 # 有效深度上限，单位米；高于该值会置零并拒绝异常 pose。

[module.segmenter]
type = "yoloe26" # 分割后端；当前 v2 pose debug 仅实现 yoloe26。
prompt = "little white cube" # YOLOE-26 文本提示词，用于定位目标物体。
max_det = 1 # 最多保留检测数量；默认单目标，避免多误检 union 污染 pose。
mask_threshold = 0.5 # mask 二值化阈值。

[module.yoloe]
model_path = "checkpoints/yoloe-26l-seg.pt" # YOLOE-26 segmentation 权重路径，相对 EgoAnchor_Python。
mobileclip2_path = "mobileclip2_b.ts" # YOLOE 文本编码器本地路径，相对 EgoAnchor_Python。
conf = 0.1 # YOLOE 检测置信度阈值；过低容易误检背景。
imgsz = 640 # YOLOE 推理输入尺寸。
use_half = false # 是否启用半精度推理；部分环境下可提速。
device = "auto" # YOLOE 推理设备：auto、cpu、cuda 或 GPU 序号字符串。

[module.ffs]
model_path = "Fast-FoundationStereo/weights/23-36-37/model_best_bp2_serialize.pth" # Fast-FoundationStereo 权重路径，相对 EgoAnchor_Python。
device = "cuda" # FFS 推理设备；CUDA 不可用时实现会回退或报错。
scale = 1.0 # FFS 内部输入缩放比例；越小越快但精度下降。
valid_iters = 4 # FFS recurrent refine 迭代次数。
max_disp = 192 # FFS 最大视差，也参与 TRT engine 自动匹配。
optimize_build_volume = "triton" # PyTorch 路径 cost-volume 后端；triton 不可用会回退 pytorch1。
seed = -1 # 随机种子；<0 表示速度优先，>=0 表示确定性模式。
cudnn_benchmark = true # 固定输入尺寸时启用 cudnn.benchmark 提速。
use_trt = true # 是否优先使用 TensorRT engine。
trt_precision = "fp16" # TensorRT engine 精度标签。
trt_strict = false # true=TRT 缺失/失败直接报错；false=自动回退 PyTorch。
trt_tag = "" # 显式 TRT artifact tag；空值按尺寸/iters/max_disp 自动生成。
trt_platform_tag = "" # 显式 TRT 平台标签；空值自动识别 win/linux/mac。
trt_feature_engine_path = "" # 显式 feature runner engine 路径；空值自动查找。
trt_post_engine_path = "" # 显式 post runner engine 路径；空值自动查找。

[module.foundationpose]
mesh_path = "data/online/cube/mesh/cube.stl" # FoundationPose 目标物体 mesh 路径，相对 EgoAnchor_Python。
est_refine_iter = 5 # register 阶段 refine 迭代次数。
track_refine_iter = 2 # track 阶段 refine 迭代次数。
symmetry_mode = "cube" # 对称约束模式：cube 或 none。
register_min_depth_valid_in_mask = 0.2 # register/re-register 前 mask 内有效深度比例下限。
re_register_on_track_lost = true # track 失败或跳变时是否用当前 2D mask 重新 register。
pose_jump_translation_m = 0.35 # 单帧 track 平移跳变拒绝阈值，单位米。
pose_jump_rotation_deg = 80.0 # 单帧 track 旋转跳变拒绝阈值，单位度。
debug = 0 # FoundationPose 内部 debug 等级。
debug_dir = "" # FoundationPose debug 输出目录；空值使用默认目录。

[module.cutie]
enabled = true # 是否启用 Cutie 进行 2D mask 时序传播。
seg_threshold = 0.1 # Cutie 分割概率阈值。
erosion_size = 5 # Cutie mask 提取 bbox 前的腐蚀核大小，单位像素。
adjust_pose = true # 是否用 Cutie bbox 中心轻量修正 FoundationPose pose_last 的图像平面平移。

[debug]
pipeline_stats_interval = 30 # 每处理多少帧打印一次 pose pipeline 性能统计。
show_mask_snapshot = true # 首次有效 mask 时是否弹出 RGB/mask/overlay 对齐快照。
mask_snapshot_window = "EgoAnchor v2 Mask Snapshot" # mask snapshot 的 OpenCV 窗口名。
mask_snapshot_width = 1440 # mask snapshot 固定窗口宽度，单位像素。
mask_snapshot_height = 420 # mask snapshot 固定窗口高度，单位像素。

[demo.video]
window_name = "EgoAnchor v2 Quest Stereo" # Quest 视频流预览 OpenCV 窗口名。
stereo_window_width = 1280 # Quest 视频流预览窗口固定宽度，单位像素。
stereo_window_height = 480 # Quest 视频流预览窗口固定高度，单位像素。
stats_interval_frames = 60 # 每显示多少帧打印一次接收统计。
wait_log_interval_s = 3.0 # 无输入时等待日志输出间隔，单位秒。

[demo.pose]
debug_window_name = "EgoAnchor v2 Pose Debug" # Python 本地 pose debug 主窗口名。
stereo_window_name = "EgoAnchor v2 Stereo" # Python 本地 stereo 辅助窗口名。
debug_window_width = 1280 # pose debug 主窗口固定宽度，单位像素。
debug_window_height = 480 # pose debug 主窗口固定高度，单位像素。
stereo_window_width = 1280 # stereo 辅助窗口固定宽度，单位像素。
stereo_window_height = 480 # stereo 辅助窗口固定高度，单位像素。
wait_log_interval_s = 3.0 # 无输入或缺少 camera_info 时等待日志输出间隔，单位秒。
