# EgoAnchor mouse object override.
# 本文件位于 配置包目录，可通过 --config .\src\egoanchor\config\mouse.toml 使用。
# 它只覆盖 defaults.toml 中与 mouse 目标相关的参数。

[module.segmenter]
prompt = "pink mouse" # YOLOE-26 文本提示词；若检测不到，可运行时用 --prompt 覆盖。
confidence_threshold = 0.2 # 检测候选置信度阈值；误检多时调高，漏检多时调低。

[module.foundationpose]
mesh_path = "data/model/pink_mouse.glb" # 相对 EgoAnchor_Python 的目标 mesh 路径；GLB 中的 PBR baseColorTexture 可被当前适配器读取。
symmetry_mode = "none" # 鼠标不是 cube 对称体，不能沿用 cube 对称约束。

