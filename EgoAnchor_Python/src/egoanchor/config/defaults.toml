# EgoAnchor 默认运行配置。
# 当前主线包含 ZMQ 数据面通信 demo、Python pose debug，以及通过 NATS 发布 PoseResult 给 Unity anchor runtime。

[server]
run_stage = 4 # Python pose debug 启动阶段：1=输入，2=分割，3=深度，4=完整 pose。

[network.data_plane]
listen_host = "*" # Python ZMQ SUB 绑定地址；Quest/Unity PUB 连接到这台机器的实际 IP。
listen_port = 15557 # Unity -> Python 数据面端口；保持新链路默认值，不回退旧 5557。
receive_hwm = 20 # ZMQ 接收高水位；限制积压，业务层仍按 topic latest-only 处理。
poll_timeout_ms = 10 # 每轮 poll 最长等待时间，单位毫秒；越小窗口响应越快。

[network.message_plane]
enabled = true # 是否启用 NATS 消息面；发布 PoseResult，并接收 reset/reacquire/control request-reply 命令。
url = "nats://127.0.0.1:4222" # NATS server URL；Quest 真机接收时 Unity 侧也应配置到同一开发机地址。
pose_result_subject = "egoanchor.v1.pose.result" # Python -> Unity PoseResult subject；必须与 subjects.v1.json 保持一致。
anchor_status_subject = "egoanchor.v1.anchor.status" # Python -> Unity AnchorStatusEvent subject；状态事件流不做 latest-only。
server_heartbeat_subject = "egoanchor.v1.server.heartbeat" # Python -> Unity ServerHeartbeat subject；用于低频链路健康诊断。
client_name = "egoanchor-python" # Python NATS 客户端名称，便于 nats-server 日志排查。
connect_timeout_s = 2.0 # 初次连接 NATS 的超时时间，单位秒。
request_timeout_s = 1.0 # 预留给未来 request/reply 命令的默认超时，当前阶段不使用。
max_pending_futures = 32 # 后台 publish Future 最大积压数；超过后丢弃新 pose，保持 latest-only。
wait_ready_on_start = false # 启动时是否等待 NATS 首次连接；false 可避免 nats-server 未启动时阻塞模型加载。
initial_retry_interval_s = 1.0 # 首次连接失败后的后台重试间隔，单位秒；允许 nats-server 晚于 Python 启动。

[runtime.commands]
max_queue_size = 128 # NATS command handler 接受后的内存队列容量；handler 只 ack/enqueue，不直接操作 pipeline。
dedup_ttl_ms = 60000 # command request_id 幂等缓存时间，单位毫秒；Unity 超时重试同一 request_id 时返回旧 ack。
execute_per_tick = 8 # 每轮 TrackingRuntime tick 最多执行的命令数量，避免长时间占用主循环。

[runtime.heartbeat]
interval_s = 1.0 # ServerHeartbeat 发布间隔，单位秒；保持低频，避免影响 pose 发布。

[runtime.logging]
enabled = true # 是否保存 Python server 结构化 JSONL 日志；用于论文实验复盘和状态机调试。
output_dir = "data/runtime_logs" # 普通运行时日志目录（eval_session_enabled=false 时使用），相对 EgoAnchor_Python；每次启动直接写入一个时间戳 JSONL 文件。
filename = "" # JSONL 文件名；空值表示使用启动时间戳，例如 20260527-031500.jsonl。
eval_session_enabled = true # 是否启用评估session模式：在共享目录写入日志并生成元数据，便于 Unity 自动配对复用。
eval_output_dir = "data/eval" # 评估session日志根目录（eval_session_enabled=true 时使用），相对 EgoAnchor_Python；每次启动在该目录下创建 <session_id>/ 子目录。
eval_metadata_filename = "python_session.json" # Python 写入的 session 元数据文件名；Unity 通过它自动找到对应 runtime log。
flush_every = 1 # 每写入多少条事件 flush 一次；1 最安全，调大可减少磁盘 flush 频率。
log_pose_results = true # 是否记录每帧 PoseResult 摘要，包括 pose score、phase、flags 和 frame_id。
log_status_events = true # 是否记录 AnchorStatusEvent 状态变化与命令执行结果。
log_heartbeats = true # 是否记录 ServerHeartbeat 摘要；心跳低频，默认记录。
log_commands = true # 是否记录 runtime 线程实际执行 command 的时间点和动作。

[pipeline]
min_process_interval_ms = 0 # 处理节流：两次 pose 推理的最小间隔(ms)；0=不节流(默认)。诊断用：高性能机设 200 限到~5fps 以排查高帧率失稳，测完设回 0。

[pipeline.calibration]
network_calib_update = true # 收到新的 QuestCameraInfo 且标定变化时刷新 K/FoundationPose。
assume_center_crop = true # K 映射方式：true=中心裁剪+缩放，false=仅线性缩放。
process_width = 640 # 算法处理图像宽度；当前 pose debug 固定缩放到该宽度。
process_height = 480 # 算法处理图像高度；当前 pose debug 固定缩放到该高度。

[pipeline.depth]
min_depth = 0.1 # 有效深度下限，单位米；低于该值会置零。
max_depth = 5.0 # 有效深度上限，单位米；相机离物体较远时可适当增大，但过大可能引入背景深度噪声。

[reliability.render_quality]
enabled = true # 是否启用渲染质量检测；默认采集重投影、mask 可见比例和深度对齐信号。
warmup_frames = 3 # register 后跳过渲染质量判定的帧数，避免初始渲染信号不稳定。
depth_distance_ratio = 0.02 # 深度 inlier 阈值随物体到相机距离放大的比例，例如 1m 时约 2cm。
depth_min_inlier_thresh_m = 0.005 # 深度 inlier 阈值下限，单位米，避免近距离时过严。
depth_min_coverage = 0.10 # mask 内有效深度覆盖率低于该值时 depth_score 返回中性 0.5。
depth_residual_scale = 2.5 # 归一化残差中位数的容忍倍数；越大越宽容，默认 2.5 对应更鲁棒的残差映射。
depth_enable_structural = true # 是否启用深度结构一致性评估（归一化深度 ZNCC）；用于区分"形状对但有系统噪声"和"pose真的错"。
depth_structural_max_weight = 0.35 # 深度结构分数的最大权重 α；实际权重根据场景复杂度（IQR）自适应调整。
depth_structural_iqr_thresh = 0.02 # 启用结构评估的深度 IQR 阈值，单位米；低于此值的平坦表面只用绝对残差评估。
depth_core_erode_kernel = 3 # 核心区域腐蚀核大小（像素）；用于排除 mask 边缘和遮挡边界的深度噪声，0 表示不腐蚀。
downscale = 2 # 渲染质量检测下采样倍数，越大越快但越粗。
min_render_area_px = 50 # 渲染前景过少时判为无效信号，避免可靠性评分误用退化投影。
color_l_weight = 0.3 # LAB ZNCC 中亮度 L 通道的相对权重；降低亮度对真实光照变化的敏感度。

[reliability.pose_score]
geo_floor = 0.05 # 几何核单维最低值；避免有效低分在几何平均中变成硬零。
reproj_weight = 0.2 # 重投影颜色分在几何核中的相对权重；颜色只作为辅助证据。
depth_weight = 0.8 # 深度对齐分在几何核中的相对权重；手柄等低纹理目标优先相信深度。

[module.segmenter]
type = "yoloe26" # 分割后端；默认 yoloe26，可显式改为 sam3。
prompt = "little white cube" # 文本提示词，用于定位目标物体；YOLOE-26 和 SAM3 共用。
confidence_threshold = 0.2 # 检测候选置信度阈值；YOLOE 和 SAM3 共用，越高越严格，过低容易误检背景。
max_det = 1 # 最多保留检测数量；默认单目标，避免多误检 union 污染 pose。
mask_threshold = 0.5 # mask 二值化阈值；YOLOE 和 SAM3 共用。

[module.yoloe]
model_path = "weights/yoloe-26l-seg.pt" # YOLOE-26 segmentation 权重路径，相对 EgoAnchor_Python，统一放在 weights 目录。
mobileclip2_path = "weights/mobileclip2_b.ts" # YOLOE 文本编码器本地路径，相对 EgoAnchor_Python，统一放在 weights 目录。
imgsz = 640 # YOLOE 推理输入尺寸。
use_half = false # 是否启用半精度推理；部分环境下可提速。
device = "auto" # YOLOE 推理设备：auto、cpu、cuda 或 GPU 序号字符串。

[module.sam3]
repo_path = "sam3" # 项目内 SAM3 仓库路径，相对 EgoAnchor_Python；其中应包含 sam3 Python package。
checkpoint_path = "sam3/assets/sam3_ckpt/sam3.pt" # SAM3 checkpoint 路径，相对 EgoAnchor_Python；默认使用本地权重，不在线下载。
resolution = 1008 # SAM3 processor 输入分辨率；默认沿用官方 image processor 设置。
device = "auto" # SAM3 推理设备：auto、cpu 或 cuda。
load_from_hf = false # 是否允许 SAM3 从 HuggingFace 下载权重；主线默认关闭，避免调试时触发网络依赖。
disable_position_precompute = true # 是否跳过 SAM3 构建阶段的位置编码预计算慢路径；当前未启用 torch.compile，建议保持 true。
async_segmentation = true # 是否在 tracking_server 主线中后台异步执行 SAM3 分割；true 时相机/debug 窗口不等待 SAM3 推理完成。
enable_logging = false # 是否允许 SAM3 内部 stdout/stderr/logging 输出到 console；默认关闭，避免模型加载刷屏遮住系统日志。

[module.ffs]
model_dir = "Fast-FoundationStereo/weights/23-36-37" # Fast-FoundationStereo 权重目录或 pth 文件路径，相对 EgoAnchor_Python。
device = "cuda" # FFS 推理设备；CUDA 不可用时实现会回退 CPU。
scale = 1.0 # FFS 内部输入缩放比例；越小越快但精度下降。
valid_iters = 4 # FFS recurrent refine 迭代次数。
max_disp = 192 # FFS 最大视差，也参与 TRT engine 自动匹配。
optimize_build_volume = "triton" # PyTorch 路径 cost-volume 后端；triton 不可用会回退 pytorch1。
seed = -1 # 随机种子；<0 表示速度优先，>=0 表示确定性模式。
cudnn_benchmark = true # 固定输入尺寸时启用 cudnn.benchmark 提速。
use_trt = true # 是否优先使用 TensorRT engine。
trt_precision = "fp16" # TensorRT engine 精度标签。
trt_strict = true # true=TRT 缺失/失败直接报错；false=自动回退 PyTorch。
trt_tag = "" # 显式 TRT artifact tag；空值按尺寸/iters/max_disp 自动生成。
trt_platform_tag = "" # 显式 TRT 平台标签；空值自动识别 win/linux/mac。
trt_feature_engine_path = "" # 显式 feature runner engine 路径；空值自动查找。
trt_post_engine_path = "" # 显式 post runner engine 路径；空值自动查找。
enable_logging = false # 是否允许 FFS 内部 stdout/stderr/logging 输出到 console；默认关闭，且不调用原工程会重置全局 logging 的格式函数。
allow_tf32 = false # 是否允许 TF32 matmul/cudnn 加速。默认 true 保持原行为。诊断用：5090(Blackwell) 上若 pose 抖动，设 false 走 fp32 排查是否低精度数值路径所致(会变慢)。

[module.foundationpose]
mesh_path = "data/model/cube.stl" # FoundationPose 目标物体 mesh 路径，相对 EgoAnchor_Python。
est_refine_iter = 5 # register 阶段 refine 迭代次数。
track_refine_iter = 2 # track 阶段 refine 迭代次数。
apply_scale = 1.0 # 加载 mesh 后应用的尺度缩放，默认保持 mesh 原尺度。
force_apply_color = false # 是否给 mesh 强制添加纯色纹理。
apply_color = [0, 159, 237] # 强制纹理颜色，RGB 顺序。
symmetry_mode = "cube" # 对称约束模式：none、cube 或 axis。
symmetry_axis = "z" # symmetry_mode=axis 时的旋转轴。
symmetry_count = 36 # symmetry_mode=axis 时离散旋转数量。
register_min_depth_valid_in_mask = 0.15 # register 前 mask 内有效深度比例下限。
debug = 0 # FoundationPose 内部 debug 等级；0=关闭内部 debug 可视化/文件输出，>0 只在专项排查时开启。
debug_dir = "FoundationPose/debug/api" # FoundationPose debug 输出目录，相对 EgoAnchor_Python。
enable_logging = false # 是否允许 FoundationPose 内部 stdout/stderr/logging 输出到 console；默认关闭，避免第三方库刷屏遮住系统日志。

[module.cutie]
enabled = true # 是否启用 Cutie 进行 2D mask 时序传播。
seg_threshold = 0.1 # Cutie 分割概率阈值。
erosion_size = 5 # Cutie mask 提取 bbox 前的腐蚀核大小，单位像素。
adjust_pose = true # 是否用 Cutie bbox 中心轻量修正 FoundationPose pose_last 的图像平面平移。
enable_logging = false # 是否允许 Cutie 内部 stdout/stderr/logging 输出到 console；默认关闭，避免第三方库刷屏遮住系统日志。

[debug]
enable_tracking_window = true # tracking_server 是否默认显示 OpenCV debug 窗口；当前 Python debug 阶段保持开启。
pipeline_stats_interval = 30 # 每处理多少帧打印一次 pose pipeline 性能统计。
show_mask_snapshot = true # register 成功时是否刷新显示真实用于注册的目标 mask。
mask_snapshot_window = "EgoAnchor Register Mask" # register mask snapshot 的 OpenCV 窗口名。
mask_snapshot_width = 1440 # mask snapshot 固定窗口宽度，单位像素；当前预留给后续扩展。
mask_snapshot_height = 420 # mask snapshot 固定窗口高度，单位像素；当前预留给后续扩展。

[demo.video]
window_name = "EgoAnchor Quest Stereo" # OpenCV 实时预览窗口名称。
stereo_window_width = 1280 # 预览窗口初始宽度，单位像素。
stereo_window_height = 480 # 预览窗口初始高度，单位像素。
stats_interval_frames = 60 # 每显示多少帧打印一次聚合接收统计。
wait_log_interval_s = 3.0 # 尚未收到 stereo 时等待日志输出间隔，单位秒。

[demo.pose]
debug_window_name = "EgoAnchor Pose Debug" # Python 本地 pose debug 主窗口名。
score_window_name = "EgoAnchor Score Debug" # Python 本地评分与渲染质量调试窗口名。
debug_window_width = 1280 # pose debug 主窗口固定宽度，单位像素。
debug_window_height = 720 # pose debug 主窗口固定高度，单位像素。
debug_window_max_fps = 20.0 # pose debug 主窗口最高重绘帧率；只限制 OpenCV 合成显示，不限制 pipeline 推理。
score_window_width = 960 # 评分调试窗口固定宽度，单位像素。
score_window_height = 800 # 评分调试窗口固定高度，单位像素；顶部预留诊断文本横幅，避免遮挡颜色/深度 2x3 诊断矩阵。
score_window_max_fps = 6.0 # 评分调试窗口最高重绘帧率；LAB/深度残差矩阵较重，默认降频避免窗口卡顿。
wait_log_interval_s = 3.0 # 无输入或缺少 camera_info 时等待日志输出间隔，单位秒。

# ============================================================================
# 目标物体覆盖配置。
# 使用方式：pixi run python .\src\run_server.py --object blue_mouse 或 --object controller_right。
# load_config(object_name=...) 会把对应 [objects.<name>.*] 子树合并到上面的默认配置之上，
# 合并后 objects 子树本身会被剔除，不进入运行时 namespace。
# ============================================================================

[objects.blue_mouse.module.segmenter]
prompt = "blue mouse" # 文本提示词；若检测不到，可用显式 --config 临时 TOML 覆盖。
confidence_threshold = 0.3 # 检测候选置信度阈值；误检多时调高，漏检多时调低。

[objects.blue_mouse.module.foundationpose]
mesh_path = "data/model/blue_mouse.glb" # 相对 EgoAnchor_Python 的目标 mesh 路径。
symmetry_mode = "none" # 鼠标不是 cube 对称体，不能沿用 cube 对称约束。

[objects.pink_mouse.module.segmenter]
prompt = "pink mouse" # 文本提示词；若检测不到，可用显式 --config 临时 TOML 覆盖。
confidence_threshold = 0.2 # 检测候选置信度阈值；误检多时调高，漏检多时调低。

[objects.pink_mouse.module.foundationpose]
mesh_path = "data/model/pink_mouse.glb" # 相对 EgoAnchor_Python 的目标 mesh 路径。
symmetry_mode = "none" # 鼠标不是 cube 对称体，不能沿用 cube 对称约束。

[objects.earphone.module.segmenter]
type = "sam3" # 耳机盒目标默认使用 SAM3 文本分割；主默认配置仍保持 yoloe26。
prompt = "small pink rounded rectangular earphone charging case" # 文本提示词；若检测不到，可用 SAM3 工具脚本做 prompt 对照。
confidence_threshold = 0.2 # 检测候选置信度阈值；SAM3 误检多时调高，漏检多时调低。

[objects.earphone.module.foundationpose]
mesh_path = "data/model/earphone.glb" # 相对 EgoAnchor_Python 的目标 mesh 路径。
symmetry_mode = "none" # 耳机盒不是 cube 对称体，不能沿用 cube 对称约束。

[objects.controller_right.module.segmenter]
# type = "sam3" # 如需让控制器目标改用 SAM3，可取消注释；主默认配置仍保持 yoloe26。
prompt = "quest 3 controller" # 文本提示词；若检测不到，可用显式 --config 临时 TOML 覆盖。
confidence_threshold = 0.35 # 检测候选置信度阈值；误检多时调高，漏检多时调低。

[objects.controller_right.module.foundationpose]
mesh_path = "data/model/MetaQuestTouchPlus_Right.glb" # 相对 EgoAnchor_Python 的目标 mesh 路径。
symmetry_mode = "none" # 控制器不是 cube 对称体，不能沿用 cube 对称约束。

[objects.controller_left.module.segmenter]
# type = "sam3" # 如需让控制器目标改用 SAM3，可取消注释；主默认配置仍保持 yoloe26。
prompt = "quest 3 controller" # 文本提示词；若检测不到，可用显式 --config 临时 TOML 覆盖。
confidence_threshold = 0.35 # 检测候选置信度阈值；误检多时调高，漏检多时调低。

[objects.controller_left.module.foundationpose]
mesh_path = "data/model/MetaQuestTouchPlus_Left.glb" # 相对 EgoAnchor_Python 的目标 mesh 路径。
symmetry_mode = "none" # 控制器不是 cube 对称体，不能沿用 cube 对称约束。
