# EgoAnchor 目标物体覆盖配置。
# 使用方式：pixi run python .\src\tracking_server.py --object blue_mouse

[objects.blue_mouse.module.segmenter]
prompt = "blue mouse" # 文本提示词；若检测不到，可运行时用 --prompt 或临时 TOML 覆盖。
confidence_threshold = 0.3 # 检测候选置信度阈值；误检多时调高，漏检多时调低。

[objects.blue_mouse.module.foundationpose]
mesh_path = "data/model/blue_mouse.glb" # 相对 EgoAnchor_Python 的目标 mesh 路径。
symmetry_mode = "none" # 鼠标不是 cube 对称体，不能沿用 cube 对称约束。

[objects.pink_mouse.module.segmenter]
prompt = "pink mouse" # 文本提示词；若检测不到，可运行时用 --prompt 或临时 TOML 覆盖。
confidence_threshold = 0.2 # 检测候选置信度阈值；误检多时调高，漏检多时调低。

[objects.pink_mouse.module.foundationpose]
mesh_path = "data/model/pink_mouse.glb" # 相对 EgoAnchor_Python 的目标 mesh 路径。
symmetry_mode = "none" # 鼠标不是 cube 对称体，不能沿用 cube 对称约束。

[objects.earphone.module.segmenter]
type = "sam3" # 耳机盒目标默认使用 SAM3 文本分割；主默认配置仍保持 yoloe26。
prompt = "small pink rounded rectangular earphone charging case" # 文本提示词；若检测不到，可用 SAM3 工具脚本做 prompt 对照。
confidence_threshold = 0.2 # 检测候选置信度阈值；SAM3 误检多时调高，漏检多时调低。

[objects.earphone.module.foundationpose]
mesh_path = "data/model/earphone.glb" # 相对 EgoAnchor_Python 的目标 mesh 路径。
symmetry_mode = "none" # 耳机盒不是 cube 对称体，不能沿用 cube 对称约束。

[objects.controller.module.segmenter]
prompt = "quest 3 controller" # 文本提示词；若检测不到，可运行时用 --prompt 或临时 TOML 覆盖。
confidence_threshold = 0.35 # 检测候选置信度阈值；误检多时调高，漏检多时调低。

[objects.controller.module.foundationpose]
mesh_path = "data/model/controller.glb" # 相对 EgoAnchor_Python 的目标 mesh 路径。
symmetry_mode = "none" # 控制器不是 cube 对称体，不能沿用 cube 对称约束。
