# EgoAnchor controller object override.
# 本文件位于 配置包目录，可通过 --config .\src\egoanchor\config\controller.toml 使用。
# 它只覆盖 defaults.toml 中与控制器目标相关的参数。

[module.segmenter]
# type = "sam3" # 控制器目标默认使用 SAM3 文本分割；主默认配置仍保持 yoloe26。
prompt = "quest 3 controller" # 文本提示词；若检测不到，可运行时用工具脚本修改 prompt 对照。
confidence_threshold = 0.35 # 检测候选置信度阈值；SAM3 误检多时调高，漏检多时调低。

[module.foundationpose]
mesh_path = "data/model/controller.glb" # 相对 EgoAnchor_Python 的目标 mesh 路径；GLB 中的 PBR baseColorTexture 可被当前适配器读取。
symmetry_mode = "none" # 控制器不是 cube 对称体，不能沿用 cube 对称约束。
