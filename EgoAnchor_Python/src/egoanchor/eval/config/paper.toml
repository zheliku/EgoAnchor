[experiment_1_2.contract]
version = 1 # 实验一/二论文分析参数契约版本。

[experiment_1_2.lag]
minimum_ms = 0.0 # 平移和旋转有效时延搜索下界，单位毫秒。
maximum_ms = 600.0 # 平移和旋转有效时延搜索上界，单位毫秒。
step_ms = 5.0 # 有效时延搜索步长，单位毫秒。
minimum_samples = 30 # 每个候选时延至少需要的有效重叠样本数。

[experiment_1_2.transition]
baseline_ms = 250.0 # 起停动作开头用于估计静止基线的时长，单位毫秒。
displacement_mm = 5.0 # 参考和显示位移被视为开始运动的阈值，单位毫米。
persistence_ms = 100.0 # 位移必须持续超过阈值的时间，单位毫秒。

[experiment_1_2.occlusion]
catastrophic_mm = 40.0 # 遮挡过程最大平移误差超过该值时记为灾难性失效，单位毫米。

[experiment_3.contract]
version = 4 # 实验三原始模板与论文分析参数契约版本；v4 删除特定来源身份门禁并固定通用 QC。
template_version = "v5.1" # 实验三原始数据模板与问卷的冻结版本。

[experiment_3.analysis]
alpha = 0.05 # 两个冻结检验家族各自使用的显著性水平。
target_participants = 24 # 正式目标样本量。
minimum_participants = 18 # 正式推断允许的最小完整配对人数。
objects_per_method = 3 # 每人每方法形成主分析分数时必须覆盖的物体数。
bootstrap_iterations = 10000 # 匹配秩双列相关置信区间的参与者级自举次数。
bootstrap_seed = 20260728 # 效应量自举的固定随机种子。
confidence_level = 0.95 # 匹配秩双列相关自举区间的置信水平。
aq_mode = "full" # AQ 计分模式；预实验正式冻结前使用完整三条目子量表，可选值为 full 或 reduced。
q10_enabled = false # Q10 默认关闭；只有预实验触发并冻结后才启用。
wilcoxon_alternative = "two-sided" # 主分析冻结为双侧配对 Wilcoxon。
wilcoxon_zero_method = "wilcox" # 主分析删除零配对差并另报非零配对数。
wilcoxon_p_method = "exact-sign-dp" # 使用含并列秩的精确符号置换动态规划计算 p 值。

[experiment_3.missing]
tia_rc_min_items = 5 # TiA Reliability/Competence 六项中形成分量表所需的最少有效条目数。
tia_up_min_items = 3 # TiA Understanding/Predictability 四项中形成分量表所需的最少有效条目数。
stias_min_items = 3 # S-TIAS 三项必须全部有效。

[experiment_3.equivalence]
enabled = false # 预实验冻结全部正等价界后才启用 TOST。
candidate_rate_margin_hz = 0.0 # 候选到达率配对差的对称等价界；0 表示尚未冻结。
vcd_median_margin = 0.0 # VCD 中位分配对差的对称等价界；0 表示尚未冻结。
admission_rate_margin = 0.0 # VCD 接纳率配对差的对称等价界；0 表示尚未冻结。
output_availability_margin = 0.0 # 输出可用率配对差的对称等价界；0 表示尚未冻结。
occlusion_seconds_margin = 0.0 # 遮挡时长配对差的对称等价界；0 表示尚未冻结。

[experiment_3.figures]
dpi = 300 # 实验三 PNG 的导出分辨率。
width_inches = 7.15 # 正文 Figure 4 双排复合图的原生宽度，贴合 VGTC 双栏版心。
height_inches = 4.45 # 正文 Figure 4 双排复合图的原生高度，包含一个共享图例和三组坐标轴。
