[contract]
version = 1 # 实验一/二论文分析参数契约版本。

[lag]
minimum_ms = 0.0 # 平移和旋转有效时延搜索下界，单位毫秒。
maximum_ms = 600.0 # 平移和旋转有效时延搜索上界，单位毫秒。
step_ms = 5.0 # 有效时延搜索步长，单位毫秒。
minimum_samples = 30 # 每个候选时延至少需要的有效重叠样本数。

[transition]
baseline_ms = 250.0 # 起停动作开头用于估计静止基线的时长，单位毫秒。
displacement_mm = 5.0 # 参考和显示位移被视为开始运动的阈值，单位毫米。
persistence_ms = 100.0 # 位移必须持续超过阈值的时间，单位毫秒。

[occlusion]
catastrophic_mm = 40.0 # 遮挡过程 P95 超过该值时记为灾难性失效，单位毫米。
