[paths]
eval_root = "data/eval" # Unity/Python 新采集 session 的本机同步暂存目录。
staging_root = "data/experiments/_staging/experiment_1_2" # 新批次完成 QC 和工作簿发布前的临时目录。
archive_root = "data/experiments/_archive/experiment_1_2" # 退出当前论文的完整旧批次冷归档目录。
active_root = "data/experiments/experiment_1_2" # 当前论文唯一使用的活动批次目录。
paper_root = "../2026-EgoAnchor" # 中文主稿、手工发布图片和最终 PDF 所在目录。

[paper]
manuscript = "egoanchor_cn_v6.tex" # 只由 latex 命令编译的版本化 LaTeX 主稿，相对于 paper_root。
output_pdf = "pdf/EgoAnchor.pdf" # 面向阅读和交付的稳定 PDF 名称，相对于 paper_root，不包含主稿版本号。

[copy_assets]
experiment_destination = "figures/panels" # 当前活动批次 analysis/figures 下实验一、二 PNG/PDF 的论文相对目标目录。

[[copy_assets.relay]]
source = "data/replay_capture/20260723_104214_928_controller_right/rendered/grid/replay_grid.pdf" # 已确认的 relay 网格 PDF，相对于 EgoAnchor_Python 根目录；更换定性图时在此显式指定。
destination = "figures/replay_grid.pdf" # relay PDF 的论文相对目标路径。

[[copy_assets.relay]]
source = "data/replay_capture/20260723_104214_928_controller_right/rendered/grid/replay_grid.png" # 已确认的 relay 网格 PNG，相对于 EgoAnchor_Python 根目录；更换定性图时在此显式指定。
destination = "figures/replay_grid.png" # relay PNG 的论文相对目标路径。
